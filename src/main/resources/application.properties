server.port=${PORT:5000}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learnhubai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
learnhub.jwt-secret=${JWT_SECRET:local-development-secret-change-before-production}
learnhub.frontend-url=${FRONTEND_URL:}
learnhub.gemini-api-key=${GEMINI_API_KEY:}
